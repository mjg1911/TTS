# .github/workflows/windows-tray.yml
name: Windows tray

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-tray:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test and tray build dependencies
        run: python -m pip install -e ".[dev,windows-tray,windows-tray-build]"

      - name: Run tray and core compatibility tests
        run: pytest tests/windows_tray tests/test_core_compatibility.py tests/test_kokoro_assets.py -q

      - name: Verify core CLI entry point
        run: python -m piper --help

      - name: Compile Windows tray package
        run: python -m compileall -q src/piper/windows_tray src/piper/kokoro_worker

      - name: Download frozen smoke voice
        shell: pwsh
        run: |
          $voiceDir = Join-Path $env:RUNNER_TEMP "piper-tray-smoke-voice"
          New-Item -ItemType Directory -Force $voiceDir | Out-Null
          $baseUri = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium"
          Invoke-WebRequest "$baseUri/en_GB-alba-medium.onnx" -OutFile (Join-Path $voiceDir "en_GB-alba-medium.onnx")
          Invoke-WebRequest "$baseUri/en_GB-alba-medium.onnx.json" -OutFile (Join-Path $voiceDir "en_GB-alba-medium.onnx.json")
          "PIPER_SMOKE_VOICE_DIR=$voiceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire pinned Kokoro release assets
        shell: pwsh
        run: |
          $lock = Get-Content "script/kokoro_assets.lock.json" -Raw | ConvertFrom-Json
          if ($lock.repository -ne "hexgrad/Kokoro-82M") { throw "Unexpected Kokoro asset repository" }
          $revision = [string]$lock.revision
          $root = Join-Path $env:RUNNER_TEMP "kokoro-assets"
          New-Item -ItemType Directory -Force $root | Out-Null
          $base = "https://huggingface.co/hexgrad/Kokoro-82M/resolve/$revision"
          Invoke-WebRequest "$base/config.json" -OutFile (Join-Path $root "config.json")
          Invoke-WebRequest "$base/kokoro-v1_0.pth" -OutFile (Join-Path $root "kokoro-v1_0.pth")
          Invoke-WebRequest "$base/voices/af_heart.pt" -OutFile (Join-Path $root "af_heart.pt")
          $downloads = @{
            "config.json" = (Join-Path $root "config.json")
            "kokoro-v1_0.pth" = (Join-Path $root "kokoro-v1_0.pth")
            "voices/af_heart.pt" = (Join-Path $root "af_heart.pt")
          }
          foreach ($relative in $downloads.Keys) {
            $actual = (Get-FileHash $downloads[$relative] -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [string]$lock.files.PSObject.Properties[$relative].Value
            if ($actual -ne $expected) { throw "Kokoro source hash mismatch for $relative" }
          }
          "PIPER_KOKORO_CONFIG=$(Join-Path $root 'config.json')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PIPER_KOKORO_MODEL=$(Join-Path $root 'kokoro-v1_0.pth')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PIPER_KOKORO_AF_HEART=$(Join-Path $root 'af_heart.pt')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require complete offline Kokoro release payload
        shell: pwsh
        run: |
          "PIPER_REQUIRE_KOKORO_PAYLOAD=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build tray executable
        shell: pwsh
        run: ./script/build_windows_tray.ps1

      - name: Smoke frozen executable
        shell: pwsh
        run: ./script/smoke_windows_tray.ps1

      - name: Verify executable artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PiperTray.exe")) {
            throw "dist/PiperTray.exe was not produced"
          }
          if ((Get-Item "dist/PiperTray.exe").Length -le 0) {
            throw "dist/PiperTray.exe is empty"
          }

      - name: Smoke frozen Kokoro worker
        shell: pwsh
        run: ./script/smoke_windows_kokoro.ps1

      - name: Build offline installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./script/build_windows_installer.ps1

      - name: Verify release payload artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "build/kokoro-payload/worker/KokoroWorker.exe")) { throw "KokoroWorker.exe missing" }
          if (-not (Test-Path "build/kokoro-payload/manifest.json")) { throw "Kokoro manifest missing" }
          if (-not (Test-Path "dist/PiperTraySetup.exe")) { throw "installer missing" }
          if ((Get-Item "dist/PiperTraySetup.exe").Length -le 0) { throw "installer empty" }

      - uses: actions/upload-artifact@v7
        with:
          name: PiperTray-windows
          path: |
            dist/PiperTray.exe
            dist/PiperTraySetup.exe
            build/kokoro-payload/manifest.json
          if-no-files-found: error
